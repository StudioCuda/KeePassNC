# Weekly heads-up when Nextcloud changes the header or frame we copy (app menu, account menu, content panel), see tools/nc-header-check.mjs.
# Not a required check and not run on pull requests: a red run here means "compare the header", not "this PR broke something".
name: nc-header
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/nc-header-check.mjs
