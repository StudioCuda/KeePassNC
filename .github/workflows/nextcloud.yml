# Runs the unit/compat tests plus the Nextcloud integration test (fresh SQLite install + browser test)
# against the official release packages, and against Nextcloud master as a heads-up canary.
# Pull requests that only touch docs (see tools/ci-docs-only.sh) skip the test steps but still report every check,
# so the required checks turn green. That's why this uses step-level ifs and not paths-ignore.
name: nextcloud-compat
on:
  # Branches get tested through their pull request; push only covers main, so nothing runs twice.
  push:
    branches: [main]
  pull_request:
# A new push to a pull request cancels the run for the older commit. Runs on main always finish.
concurrency:
  group: nextcloud-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# MODULE_TYPELESS_PACKAGE_JSON: Node says so for every src/*.js module it loads in the tests. Adding "type": "module"
# would change how esbuild bundles jsqr (the QR worker), so the notice is silenced here instead.
env:
  NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The master canary may fail without turning the whole run red.
    continue-on-error: ${{ matrix.canary == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nc34, package: latest-34, browser: true }
          - { name: nc35, package: latest-35 }
          # master builds its frontend with Node 24 / npm 11; npm 10 misreads its lock file
          - { name: nc-master, ref: master, canary: true, node: 24 }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # ubuntu-latest moves to a new release now and then. The caches below hold files built for one release (a Playwright
      # browser needs that release's libraries, the .deb files are release-specific), so the release is part of their keys.
      - name: Ubuntu release
        id: os
        run: |
          . /etc/os-release
          echo "id=$ID$VERSION_ID" >> $GITHUB_OUTPUT
          echo "Runner: $PRETTY_NAME, image ${ImageVersion:-unknown}" >> $GITHUB_STEP_SUMMARY
      - name: Docs only?
        id: changes
        run: tools/ci-docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with: { node-version: '${{ matrix.node || 22 }}' }
      - uses: shivammathur/setup-php@v2
        if: steps.changes.outputs.docs_only != 'true'
        with: { php-version: '8.3', extensions: 'sqlite3, pdo_sqlite, gd, zip, curl, mbstring, xml, intl, bcmath, gmp' }
      # System-wide on purpose: the tests start python3 with -I, which ignores the per-user site-packages.
      # apt's downloads are what hangs on a slow mirror, so the .deb files are kept between runs (see tools/ci-apt.sh).
      - uses: actions/cache/restore@v6
        id: apt-cache
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ steps.os.outputs.id }}-e2e-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
          restore-keys: apt-${{ steps.os.outputs.id }}-e2e-
      - run: tools/ci-retry.sh 120 3 tools/ci-apt.sh keepassxc python3-pip && sudo pip install --break-system-packages pykeepass
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm ci || npm install
        if: steps.changes.outputs.docs_only != 'true'
      - name: Playwright version
        id: pw
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.os.outputs.id }}-chromium-${{ steps.pw.outputs.version }}
      - name: Chromium for the browser tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          tools/ci-retry.sh 120 3 npx playwright-core install-deps chromium
          tools/ci-retry.sh 120 3 npx playwright-core install chromium
          echo "CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> $GITHUB_ENV
      - run: npm run build && npm run test:unit && npm run test:compat
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run test:e2e && npm run test:ui && npm run test:theme && npm run test:keyfile && npm run test:credentials && npm run test:create && npm run test:remote && npm run test:offline && npm run test:fidelity && npm run test:pass
        if: matrix.browser && steps.changes.outputs.docs_only != 'true'
      # The package is cached by its published checksum, so the cache is only used while the file is unchanged.
      - name: Checksum of the release package
        id: ncsum
        if: matrix.package && steps.changes.outputs.docs_only != 'true'
        run: |
          tools/ci-retry.sh 60 3 curl -fsSLo nc.sha256 "https://download.nextcloud.com/server/releases/${{ matrix.package }}.tar.bz2.sha256"
          echo "sum=$(awk '/\.tar\.bz2$/ { print $1; exit }' nc.sha256)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        if: matrix.package && steps.changes.outputs.docs_only != 'true'
        with:
          path: ${{ matrix.package }}.tar.bz2
          key: nc-${{ matrix.package }}-${{ steps.ncsum.outputs.sum }}
      - name: Get the release package
        if: matrix.package && steps.changes.outputs.docs_only != 'true'
        run: |
          base=https://download.nextcloud.com/server/releases
          [ -f "${{ matrix.package }}.tar.bz2" ] || tools/ci-retry.sh 300 3 curl -fsSLO "$base/${{ matrix.package }}.tar.bz2"
          sha256sum -c --ignore-missing nc.sha256
          tar xjf "${{ matrix.package }}.tar.bz2" && mv nextcloud nc
      - name: Get and build Nextcloud from source
        if: matrix.ref && steps.changes.outputs.docs_only != 'true'
        run: |
          git clone --depth 1 --branch ${{ matrix.ref }} https://github.com/nextcloud/server.git nc
          cd nc && git submodule update --init --depth 1 && npm ci && npm run build
      - run: NC_DIR=$PWD/nc NC_PORT=18080 node tests/nextcloud/run.mjs
        if: steps.changes.outputs.docs_only != 'true'
      - name: Make the apt cache readable for the cache action
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
      - uses: actions/cache/save@v6
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ steps.os.outputs.id }}-e2e-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}

  # The same browser suites (no Nextcloud needed) in the other two engines. Both are required checks:
  # a red job here means the app behaves differently from Chromium, and that is a bug to fix.
  browsers:
    name: browsers (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # ubuntu-latest moves to a new release now and then. The caches below hold files built for one release (a Playwright
      # browser needs that release's libraries, the .deb files are release-specific), so the release is part of their keys.
      - name: Ubuntu release
        id: os
        run: |
          . /etc/os-release
          echo "id=$ID$VERSION_ID" >> $GITHUB_OUTPUT
          echo "Runner: $PRETTY_NAME, image ${ImageVersion:-unknown}" >> $GITHUB_STEP_SUMMARY
      - name: Docs only?
        id: changes
        run: tools/ci-docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with: { node-version: 22 }
      # apt's downloads are what hangs on a slow mirror, so the .deb files are kept between runs (see tools/ci-apt.sh).
      - uses: actions/cache/restore@v6
        id: apt-cache
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ steps.os.outputs.id }}-browsers-${{ matrix.browser }}-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
          restore-keys: apt-${{ steps.os.outputs.id }}-browsers-${{ matrix.browser }}-
      - run: tools/ci-retry.sh 120 3 tools/ci-apt.sh keepassxc python3-pip && sudo pip install --break-system-packages pykeepass
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm ci || npm install
        if: steps.changes.outputs.docs_only != 'true'
      - name: Playwright version
        id: pw
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.os.outputs.id }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      - run: tools/ci-retry.sh 120 3 npx playwright-core install-deps ${{ matrix.browser }}
        if: steps.changes.outputs.docs_only != 'true'
      - run: tools/ci-retry.sh 120 3 npx playwright-core install ${{ matrix.browser }}
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run build
        if: steps.changes.outputs.docs_only != 'true'
      # Two lanes that run at the same time, about 40 % faster than one after the other (measured on the runner: Firefox 9:30
      # to about 5:40, WebKit 9:08 to about 6:50, eight parallel runs without a failure). Lane 1 has the long e2e suite, lane 2
      # the Argon2-heavy key file suite; the suites don't share ports or folders. A failing suite shows its whole log below.
      - name: Browser suites
        run: tools/ci-suites.sh "e2e credentials create remote" "keyfile ui offline fidelity theme pass"
        if: steps.changes.outputs.docs_only != 'true'
      - name: Make the apt cache readable for the cache action
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
      - uses: actions/cache/save@v6
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ steps.os.outputs.id }}-browsers-${{ matrix.browser }}-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
