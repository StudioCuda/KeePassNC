# Runs the unit/compat tests plus the Nextcloud integration test (fresh SQLite install + browser test)
# against the official release packages, and against Nextcloud master as a heads-up canary.
# Pull requests that only touch docs (see tools/ci-docs-only.sh) skip the test steps but still report every check,
# so the required checks turn green. That's why this uses step-level ifs and not paths-ignore.
name: nextcloud-compat
on:
  # Branches get tested through their pull request; push only covers main, so nothing runs twice.
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The master canary may fail without turning the whole run red.
    continue-on-error: ${{ matrix.canary == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nc34, package: latest-34, browser: true }
          - { name: nc35, package: latest-35 }
          # master builds its frontend with Node 24 / npm 11; npm 10 misreads its lock file
          - { name: nc-master, ref: master, canary: true, node: 24 }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Docs only?
        id: changes
        run: tools/ci-docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with: { node-version: '${{ matrix.node || 22 }}' }
      - uses: shivammathur/setup-php@v2
        if: steps.changes.outputs.docs_only != 'true'
        with: { php-version: '8.3', extensions: 'sqlite3, pdo_sqlite, gd, zip, curl, mbstring, xml, intl, bcmath, gmp' }
      # System-wide on purpose: the tests start python3 with -I, which ignores the per-user site-packages.
      # apt's downloads are what hangs on a slow mirror, so the .deb files are kept between runs (see tools/ci-apt.sh).
      - uses: actions/cache/restore@v4
        id: apt-cache
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
          restore-keys: apt-${{ runner.os }}-e2e-
      - run: tools/ci-retry.sh 300 3 tools/ci-apt.sh keepassxc python3-pip && sudo pip install --break-system-packages pykeepass
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm ci || npm install
        if: steps.changes.outputs.docs_only != 'true'
      - name: Playwright version
        id: pw
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}
      - name: Chromium for the browser tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          tools/ci-retry.sh 300 3 npx playwright-core install-deps chromium
          tools/ci-retry.sh 300 3 npx playwright-core install chromium
          echo "CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> $GITHUB_ENV
      - run: npm run build && npm run test:unit && npm run test:compat
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run test:e2e && npm run test:ui && npm run test:theme && npm run test:keyfile && npm run test:credentials && npm run test:create && npm run test:remote && npm run test:offline && npm run test:fidelity && npm run test:pass
        if: matrix.browser && steps.changes.outputs.docs_only != 'true'
      - name: Get the release package
        if: matrix.package && steps.changes.outputs.docs_only != 'true'
        run: |
          base=https://download.nextcloud.com/server/releases
          curl -fsSLO "$base/${{ matrix.package }}.tar.bz2"
          curl -fsSLO "$base/${{ matrix.package }}.tar.bz2.sha256"
          sha256sum -c --ignore-missing "${{ matrix.package }}.tar.bz2.sha256"
          tar xjf "${{ matrix.package }}.tar.bz2" && mv nextcloud nc
      - name: Get and build Nextcloud from source
        if: matrix.ref && steps.changes.outputs.docs_only != 'true'
        run: |
          git clone --depth 1 --branch ${{ matrix.ref }} https://github.com/nextcloud/server.git nc
          cd nc && git submodule update --init --depth 1 && npm ci && npm run build
      - run: NC_DIR=$PWD/nc NC_PORT=18080 node tests/nextcloud/run.mjs
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/cache/save@v4
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}

  # The same browser suites (no Nextcloud needed) in the other two engines. Informational for now:
  # a red job here means "differs from Chromium", it does not block merging.
  browsers:
    name: browsers (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Docs only?
        id: changes
        run: tools/ci-docs-only.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with: { node-version: 22 }
      # apt's downloads are what hangs on a slow mirror, so the .deb files are kept between runs (see tools/ci-apt.sh).
      - uses: actions/cache/restore@v4
        id: apt-cache
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-browsers-${{ matrix.browser }}-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
          restore-keys: apt-${{ runner.os }}-browsers-${{ matrix.browser }}-
      - run: tools/ci-retry.sh 300 3 tools/ci-apt.sh keepassxc python3-pip && sudo pip install --break-system-packages pykeepass
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm ci || npm install
        if: steps.changes.outputs.docs_only != 'true'
      - name: Playwright version
        id: pw
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      - run: tools/ci-retry.sh 300 3 npx playwright-core install-deps ${{ matrix.browser }}
        if: steps.changes.outputs.docs_only != 'true'
      - run: tools/ci-retry.sh 300 3 npx playwright-core install ${{ matrix.browser }}
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run build
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run test:e2e
        if: steps.changes.outputs.docs_only != 'true'
      - run: npm run test:ui
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:theme
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:keyfile
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:credentials
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:create
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:remote
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:offline
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:fidelity
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - run: npm run test:pass
        if: (success() || failure()) && steps.changes.outputs.docs_only != 'true'
      - uses: actions/cache/save@v4
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ runner.os }}-browsers-${{ matrix.browser }}-${{ hashFiles('package-lock.json', 'tools/ci-apt.sh') }}
